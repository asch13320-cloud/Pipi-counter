<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Permanent+Marker&display=swap">
<style>
:root{--paper:#fbf6e6;--line:#bcd3ec;--margin:#e8777c;--ink:#1d2a4a;--blue:#4aa8ff;--accent:#e8453c;--hl:#ffe14d;--card:#fffdf4;--eraser:#f59ab0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#22302d;--line:rgba(255,255,255,.07);--margin:rgba(255,160,150,.35);--ink:#f3efe3;--blue:#7cc6ff;--accent:#ff9a8a;--hl:#d9b72e;--card:#2b3b37;--eraser:#d97a92}}
:root[data-theme="dark"]{--paper:#22302d;--line:rgba(255,255,255,.07);--margin:rgba(255,160,150,.35);--ink:#f3efe3;--blue:#7cc6ff;--accent:#ff9a8a;--hl:#d9b72e;--card:#2b3b37;--eraser:#d97a92}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{margin:0;min-height:100vh;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px 24px,transparent 24px),repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);color:var(--ink);font-family:Gaegu,"Comic Sans MS","Chalkboard SE",cursive;font-weight:700;font-size:20px;padding:14px 16px 28px 38px;display:flex;flex-direction:column;gap:12px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
section{display:flex;flex-direction:column;gap:12px}
[hidden]{display:none!important}
.wob{filter:url(#wob)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
h1{margin:0;font-family:"Permanent Marker",Gaegu,cursive;font-weight:400;font-size:30px;line-height:1.05;transform:rotate(-1.5deg)}
h1 b{font-weight:400;background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%);padding:0 4px}
#date{font-size:17px;text-transform:capitalize;border-bottom:3px dotted var(--ink);transform:rotate(1deg);white-space:nowrap}
.tabs{display:flex;gap:8px}
.tabs button{font:inherit;font-weight:700;font-size:21px;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:14px 14px 4px 4px;padding:3px 24px;cursor:pointer;transform:rotate(-1deg)}
.tabs button[aria-selected=true]{background:var(--hl);color:#1d2a4a;transform:rotate(1deg) translateY(-2px)}
.top{display:flex;align-items:center;gap:14px}
.num{flex:none;width:124px;height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:5px solid var(--accent);border-radius:52% 48% 55% 45%/48% 56% 44% 52%;transform:rotate(-5deg);color:var(--accent);line-height:.9}
.count{font-family:"Permanent Marker",Gaegu,cursive;font-weight:400;font-size:70px}
.num small{font-size:15px;color:var(--ink)}
.bubble{position:relative;flex:1;background:var(--card);border:3px solid var(--ink);border-radius:20px 24px 22px 14px/22px 18px 24px 20px;padding:10px 12px;font-size:19px;line-height:1.1;transform:rotate(1.5deg)}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-4px;width:20px;height:20px;background:var(--card);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
.stage{position:relative;display:flex;justify-content:center}
.tap{position:relative;border:0;background:none;padding:0;cursor:pointer;width:min(72vw,270px);font:inherit;color:inherit}
.tap.bot{width:min(46vw,170px)}
.tap svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%}
.tap.sq svg{animation:squish .38s}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.14,.84)}62%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
.body{fill:var(--blue);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.hi{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:.75}
.f{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fi{fill:var(--ink)}
.fw{fill:#fff;stroke:var(--ink);stroke-width:4}
.ch{fill:var(--accent);opacity:.45}
.zz{font-family:"Permanent Marker",cursive;fill:var(--ink);font-size:26px}
.bfill{fill:var(--card)}
.bline{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.cap{fill:var(--accent);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.wf{fill:var(--blue);opacity:.9}
.wat{transform:translateY(236px);transition:transform 1s ease-out}
.wat.full{transform:translateY(62px)}
.wat.nt{transition:none}
.word{position:absolute;left:50%;top:6%;font-family:"Permanent Marker",Gaegu,cursive;font-size:30px;color:var(--accent);pointer-events:none;animation:word .8s ease-out forwards;white-space:nowrap}
@keyframes word{from{opacity:1;transform:translate(var(--x),0) rotate(var(--r)) scale(.7)}to{opacity:0;transform:translate(var(--x),-70px) rotate(var(--r)) scale(1.2)}}
.fall{position:absolute;left:50%;bottom:6%;width:18px;margin-left:-9px;pointer-events:none;animation:fall .7s ease-in forwards}
@keyframes fall{from{opacity:1;transform:translateY(-10px)}to{opacity:0;transform:translateY(90px)}}
.hint{text-align:center;font-size:17px;margin-top:-4px}
.tal{display:flex;flex-wrap:wrap;gap:2px 8px;min-height:60px;align-items:center}
.tal.p path{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.tal.e{gap:4px 6px;min-height:52px}
.bt{fill:var(--blue);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.tal p{margin:0;font-size:18px;opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.last{font-size:19px;border-bottom:3px dotted var(--ink);padding-bottom:2px}
.undo{font:inherit;font-weight:700;font-size:19px;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:10px 8px 11px 7px;padding:5px 16px 5px 12px;background:linear-gradient(90deg,var(--card) 68%,var(--eraser) 68%);transform:rotate(-3deg)}
.undo:active{transform:rotate(-3deg) scale(.93)}
h2{margin:6px 0 0;font-family:"Permanent Marker",Gaegu,cursive;font-weight:400;font-size:20px}
.hist{display:flex;gap:9px;align-items:flex-end;height:112px;padding-top:4px}
.d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:17px;gap:2px}
.d i{display:block;width:100%;border:3px solid var(--ink);border-radius:4px 7px 3px 6px;background:repeating-linear-gradient(45deg,var(--blue) 0 3px,transparent 3px 8px);min-height:7px}
.d.t i{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 8px)}
.d .n{font-size:19px}
@media (prefers-reduced-motion:reduce){.tap.sq svg,.word,.fall{animation:none}.wat{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter></svg>

<header><h1 id="ttl"></h1><div id="date"></div></header>
<div class="tabs" role="tablist"><button id="t-pipi" role="tab">Pipi</button><button id="t-eau" role="tab">Eau</button></div>

<section id="s-pipi">
  <div class="top">
    <div class="num wob"><div class="count" id="count">0</div><small>aujourd’hui</small></div>
    <div class="bubble" id="bubble"></div>
  </div>
  <div class="stage" id="stage">
    <button class="tap" id="tap" aria-label="Noter un pipi">
      <svg viewBox="0 0 200 215" class="wob">
        <path class="body" d="M100 8C92 42 34 100 34 142a66 66 0 0 0 132 0C166 100 108 42 100 8Z"/>
        <path class="hi" d="M64 112q-14 22-8 46"/>
        <ellipse class="ch" cx="62" cy="158" rx="11" ry="7"/><ellipse class="ch" cx="138" cy="158" rx="11" ry="7"/>
        <g id="face"></g>
      </svg>
    </button>
  </div>
  <div class="hint">touche la goutte à chaque pipi</div>
  <div id="tal" class="tal p wob"></div>
  <div class="row"><div class="last" id="last"></div><button class="undo" id="undo">gommer</button></div>
  <h2>Ma semaine</h2>
  <div class="hist wob" id="hist"></div>
</section>

<section id="s-eau" hidden>
  <div class="top">
    <div class="num wob"><div class="count" id="ecount">0</div><small id="eunit">gourde</small></div>
    <div class="bubble" id="ebubble"></div>
  </div>
  <div class="stage" id="estage">
    <button class="tap bot" id="etap" aria-label="Noter une gourde remplie">
      <svg viewBox="0 0 140 250" class="wob">
        <defs><clipPath id="bc"><path d="M52 34H88V50C110 58 114 72 114 92V204A22 22 0 0 1 92 226H48A22 22 0 0 1 26 204V92C26 72 30 58 52 50Z"/></clipPath></defs>
        <rect class="cap" x="50" y="8" width="40" height="26" rx="6"/>
        <path class="bfill" d="M52 34H88V50C110 58 114 72 114 92V204A22 22 0 0 1 92 226H48A22 22 0 0 1 26 204V92C26 72 30 58 52 50Z"/>
        <g clip-path="url(#bc)"><g id="water" class="wat"><path class="wf" d="M0 0q17-9 35 0t35 0t35 0t35 0V260H0Z"/></g></g>
        <path class="bline" d="M52 34H88V50C110 58 114 72 114 92V204A22 22 0 0 1 92 226H48A22 22 0 0 1 26 204V92C26 72 30 58 52 50Z"/>
        <path class="f" style="stroke-width:3" d="M104 100h10M104 150h10M104 190h10M26 100h10M26 150h10M26 190h10"/>
        <ellipse class="ch" cx="40" cy="140" rx="8" ry="5"/><ellipse class="ch" cx="100" cy="140" rx="8" ry="5"/>
        <g id="eface"></g>
      </svg>
    </button>
  </div>
  <div class="hint">touche la gourde à chaque remplissage (1 L)</div>
  <div id="etal" class="tal e wob"></div>
  <div class="row"><div class="last" id="elast"></div><button class="undo" id="eundo">gommer</button></div>
  <h2>Ma semaine</h2>
  <div class="hist wob" id="ehist"></div>
</section>

<script>
(function(){
var S={pipi:{k:'pipi-v1',d:{}},eau:{k:'eau-v1',d:{}}},tab='pipi',x;
for(x in S){try{S[x].d=JSON.parse(localStorage.getItem(S[x].k)||'{}')||{}}catch(e){S[x].d={}}}
try{tab=localStorage.getItem('carnet-tab')==='eau'?'eau':'pipi'}catch(e){}
function save(n){try{localStorage.setItem(S[n].k,JSON.stringify(S[n].d))}catch(e){}}
function key(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(t){var d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function rnd(s){var v=Math.sin(s*12.9898)*43758.5453;return v-Math.floor(v)}
function $(i){return document.getElementById(i)}
var J=['D','L','M','M','J','V','S'];

function pface(n){
if(n===0)return '<path class="f" d="M64 136q12 9 24 0M112 136q12 9 24 0"/><path class="f" d="M90 166q10 6 20 0"/><text class="zz" x="140" y="84">Z</text><text class="zz" x="160" y="58" style="font-size:20px">z</text>';
if(n<5)return '<circle class="fi" cx="78" cy="134" r="7"/><circle class="fi" cx="122" cy="134" r="7"/><path class="f" d="M80 158q20 24 40 0"/>';
if(n<9)return '<circle class="fw" cx="78" cy="133" r="11"/><circle class="fw" cx="122" cy="133" r="11"/><circle class="fi" cx="80" cy="135" r="5"/><circle class="fi" cx="124" cy="135" r="5"/><ellipse class="fi" cx="100" cy="170" rx="11" ry="14"/>';
return '<circle class="fw" cx="76" cy="132" r="14"/><circle class="fw" cx="124" cy="132" r="14"/><circle class="fi" cx="76" cy="130" r="3"/><circle class="fi" cx="124" cy="130" r="3"/><path class="f" d="M74 172l8-9 9 9 9-9 9 9 9-9 9 9"/>';
}
function psay(n){
if(n===0)return 'Zzz… réveille-moi au premier pipi !';
if(n<3)return 'Noté dans le carnet !';
if(n<5)return 'Ça roule, continue comme ça.';
if(n<7)return 'Eh ben dis donc, quel débit !';
if(n<9)return 'Mon réservoir déborde de joie !';
return 'AU SECOURS, JE ME NOIE !';
}
function eface(n){
if(n===0)return '<circle class="fi" cx="52" cy="118" r="5"/><circle class="fi" cx="88" cy="118" r="5"/><path class="f" d="M56 154q14-14 28 0"/>';
if(n<3)return '<circle class="fi" cx="52" cy="118" r="6"/><circle class="fi" cx="88" cy="118" r="6"/><path class="f" d="M54 144q16 18 32 0"/>';
if(n<5)return '<circle class="fw" cx="52" cy="118" r="9"/><circle class="fw" cx="88" cy="118" r="9"/><circle class="fi" cx="54" cy="120" r="4"/><circle class="fi" cx="90" cy="120" r="4"/><ellipse class="fi" cx="70" cy="152" rx="8" ry="10"/>';
return '<path class="f" d="M43 122q9-12 18 0M79 122q9-12 18 0"/><path class="f" style="fill:#fff" d="M52 144q18 26 36 0Z"/>';
}
function esay(n){
if(n===0)return 'Je suis à sec… remplis-moi !';
if(n===1)return 'Première gourde, glou glou !';
if(n<4)return 'Tu t’hydrates comme un chef.';
if(n<6)return 'Quel débit ! Un vrai poisson.';
return 'Tu es une rivière ambulante !';
}
function grp(c,g){
var s='<svg viewBox="0 0 64 56" width="62" height="54">',i,v;
for(i=0;i<Math.min(c,4);i++){v=8+i*14+rnd(g*10+i)*3;s+='<path d="M'+v.toFixed(1)+' '+(6+rnd(g*7+i)*3).toFixed(1)+'L'+(v+rnd(g+i*2)*4-2).toFixed(1)+' '+(50+rnd(i+g*3)*3).toFixed(1)+'"/>'}
if(c===5)s+='<path d="M3 42L61 14"/>';
return s+'</svg>';
}
function ptally(n){
var g=Math.floor(n/5),r=n%5,h='',i;
for(i=0;i<g;i++)h+=grp(5,i);
if(r)h+=grp(r,g);
return h||'<p>rien dans le carnet…</p>';
}
function etally(n){
var h='',i;
for(i=0;i<n;i++)h+='<svg viewBox="0 0 24 44" width="26" height="46" style="transform:rotate('+((rnd(i+3)*10-5).toFixed(1))+'deg)"><path class="bt" d="M9 2h6v6c5 2 7 5 7 9v22a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V17c0-4 2-7 7-9Z"/></svg>';
return h||'<p>aucune gourde pour l’instant…</p>';
}
function hist(el,d){
var days=[],max=1,i,o,c;
for(i=6;i>=0;i--){o=new Date();o.setDate(o.getDate()-i);c=(d[key(o)]||[]).length;max=Math.max(max,c);days.push({d:o,c:c,t:i===0})}
$(el).innerHTML=days.map(function(v){return '<div class="d'+(v.t?' t':'')+'"><span class="n">'+v.c+'</span><i style="height:'+Math.round(v.c/max*66)+'%"></i><span>'+J[v.d.getDay()]+'</span></div>'}).join('');
}
function render(){
var p=S.pipi.d[key()]||[],e=S.eau.d[key()]||[];
$('date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
$('count').textContent=p.length;$('bubble').textContent=psay(p.length);
$('face').innerHTML=pface(p.length);$('tal').innerHTML=ptally(p.length);
$('last').textContent='dernier pipi : '+(p.length?hm(p[p.length-1]):'—');
hist('hist',S.pipi.d);
$('ecount').textContent=e.length;$('eunit').textContent=e.length>1?'gourdes':'gourde';
$('ebubble').textContent=esay(e.length);$('eface').innerHTML=eface(e.length);$('etal').innerHTML=etally(e.length);
$('elast').textContent=e.length?'dernière : '+hm(e[e.length-1])+' · total '+e.length+' L':'total : 0 L';
hist('ehist',S.eau.d);
}
function show(){
var e=tab==='eau';
$('s-pipi').hidden=e;$('s-eau').hidden=!e;
$('t-pipi').setAttribute('aria-selected',!e);$('t-eau').setAttribute('aria-selected',e);
$('ttl').innerHTML=e?'Le carnet<br>d’<b>eau</b>':'Le carnet<br>de <b>pipi</b>';
try{localStorage.setItem('carnet-tab',tab)}catch(er){}
}
$('t-pipi').onclick=function(){tab='pipi';show()};
$('t-eau').onclick=function(){tab='eau';show()};

var W=$('water');
function fx(stage,tp,words){
var w=document.createElement('span'),f=document.createElement('span');
w.className='word';w.textContent=words[Math.floor(Math.random()*words.length)];
w.style.setProperty('--x',(Math.random()*120-100)+'px');w.style.setProperty('--r',(Math.random()*30-15)+'deg');
f.className='fall';f.innerHTML='<svg viewBox="0 0 20 26"><path d="M10 1C8 8 2 13 2 18a8 8 0 0 0 16 0C18 13 12 8 10 1Z" fill="var(--blue)" stroke="var(--ink)" stroke-width="2"/></svg>';
stage.appendChild(w);stage.appendChild(f);
setTimeout(function(){w.remove();f.remove()},850);
tp.classList.remove('sq');void tp.offsetWidth;tp.classList.add('sq');
}
function add(n){var k=key();(S[n].d[k]=S[n].d[k]||[]).push(Date.now());save(n);try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
function undo(n){var a=S[n].d[key()];if(a&&a.length){a.pop();save(n);render();return a.length}return -1}
$('tap').onclick=function(){add('pipi');render();fx($('stage'),$('tap'),['plic !','ploc !','splash !','plouf !','pssshh !'])};
$('undo').onclick=function(){undo('pipi')};
$('etap').onclick=function(){
add('eau');render();
W.setAttribute('class','wat nt');void W.getBoundingClientRect();W.setAttribute('class','wat full');
fx($('estage'),$('etap'),['glou !','glouglou !','slurp !','plouf !','gloup !']);
};
$('eundo').onclick=function(){if(undo('eau')===0)W.setAttribute('class','wat')};
render();show();
if((S.eau.d[key()]||[]).length)W.setAttribute('class','wat full nt');
})();
</script>
</body>
</html>
